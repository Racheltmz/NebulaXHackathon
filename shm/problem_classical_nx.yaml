name: "ps3-shm-nx"
objective: "Maximize SHM cumulative-fatigue-damage regression score (max(0,1-MAPE)) via classical CPU-only ML on the raw single-channel stress time series -- seeded from the independent nebulax promoted pipeline; inputs are per-recording feature vectors."
primary_metric: "combined_score"
report_language: "en"
search_dataset: "../data/nx_arrays/shm_train_x.npy"
holdout_dataset: "../data/nx_arrays/shm_test_x.npy"
iterations: 100
seeds: [11, 23, 47]
hard_constraints:
  - "Model.fit(self, X, y) and Model.predict(self, X) signatures must not change."
  - "predict() must never receive labels; fit() must never read holdout data."
  - "No network access, no GPU/deep-learning imports (sandbox has numpy/scikit-learn/scipy only)."
  - "No file access outside the sandboxed input/output paths provided by the harness."
  - "MAPE is unstable near-zero true values; a naive mean-target baseline scores 0.0 by design, not a bug -- there is real room to improve."
weak_baselines:
  - "initial_program (mean-target regressor)"
strong_baselines:
  - "prior raw-signal-statistics (peak/RMS/std) fused regressor (external, same PS3 SHM task, ~0.46-0.48 score)"
program_contract:
  enforce_public_signatures: true
model_context:
  minimum_context_window_tokens: null
  utilization: 0.8
  chars_per_token: 2.0
  fixed_prompt_reserve_tokens: 2048
  artifact_reserve_tokens: 4096
code_budget:
  growth_ratio: 1.5
  growth_allowance_chars: 4000
  hard_max_chars: 20000
runtime:
  docker:
    profile: null
    memory: null
    cpus: null
    pids_limit: null
    tmpfs_size: null
budget:
  max_iterations: 100
  max_wall_time_minutes: 180
  max_estimated_cost_usd: null
  estimated_cost_per_iteration_usd: null
