name: "ps3-acv"
objective: "Maximize ACV faulty-car rank-decay score via classical CPU-only ML on the raw per-car 8-channel (stats + case-relative residual) arrays."
primary_metric: "combined_score"
report_language: "en"
search_dataset: "../data/ps3_arrays/acv_train_x.npy"
holdout_dataset: "../data/ps3_arrays/acv_test_x.npy"
iterations: 100
seeds: [11, 23, 47]
hard_constraints:
  - "Model.fit(self, X, y) and Model.predict(self, X) signatures must not change."
  - "predict() must never receive labels; fit() must never read holdout data."
  - "No network access, no GPU/deep-learning imports (sandbox has numpy/scikit-learn/scipy only)."
  - "No file access outside the sandboxed input/output paths provided by the harness."
  - "Only 5 training cases (40 cars) exist; the harness uses group-aware CV so cars from one case never straddle train/test -- do not assume row order encodes case membership."
weak_baselines:
  - "baseline_classical.py (mean-abs-magnitude heuristic)"
strong_baselines:
  - "prior TimesFM3-embedding attention/MIL probe under leave-one-case-out CV (external, same PS3 ACV task, ~0.65-0.67 rank-decay)"
program_contract:
  enforce_public_signatures: true
model_context:
  minimum_context_window_tokens: null
  utilization: 0.8
  chars_per_token: 2.0
  fixed_prompt_reserve_tokens: 2048
  artifact_reserve_tokens: 4096
code_budget:
  growth_ratio: 1.5
  growth_allowance_chars: 4000
  hard_max_chars: 20000
runtime:
  docker:
    profile: null
    memory: null
    cpus: null
    pids_limit: null
    tmpfs_size: null
budget:
  max_iterations: 100
  max_wall_time_minutes: 180
  max_estimated_cost_usd: null
  estimated_cost_per_iteration_usd: null
